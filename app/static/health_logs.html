<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备健康与日志 · SSD BenchmarkTest 系统</title><link rel="stylesheet" href="/static/portal.css?v=32"></head><body data-page="advanced"><header><a class="brand" href="/"><span class="brand-icon">S</span><span class="brand-text"><span class="brand-name">SSD BenchmarkTest</span><em>系统</em></span></a><nav><a data-nav="devices" href="/devices">设备扫描</a><a data-nav="tests" href="/tests">单项测试</a><a data-nav="qd" href="/qd-scan">QD 扫描</a><a data-nav="queue" href="/queue">批量测试</a><a data-nav="task-list" href="/tasks">全部任务</a><a data-nav="results" href="/results">结果查询</a><a data-nav="advanced" href="/advanced">高级功能</a></nav><b class="online">● <em id="service-status">服务检查中</em></b></header><main><section class="hero page"><div><p class="eyebrow">DEVICE HEALTH &amp; LOGS</p><h1>设备健康与日志</h1><p>采集 NVMe SMART 健康快照、运行诊断，并归档 Telemetry 与扩展 SMART 二进制日志。</p></div><a class="btn white" href="/devices">扫描设备</a></section><section class="panel health-toolbar"><div class="fields"><label><span class="field-title">目标设备</span><select id="health-device"></select></label></div><div class="actions"><button class="btn primary" id="health-capture">采集 SMART 健康快照</button><button class="btn secondary" id="health-diagnose">运行健康诊断</button><span id="health-message"></span></div></section><section class="health-layout"><section class="panel"><div class="panel-head"><div><h2>当前健康状态</h2><p>每次采集都会持久化保存，用于观察温度与寿命趋势。</p></div></div><div class="metric-grid health-metrics" id="health-summary"><div class="empty">请选择设备后采集 SMART 数据。</div></div><div id="health-warnings" class="notice hidden"></div><h3 class="subheading">温度趋势</h3><div id="health-history" class="simple-list empty">暂无历史健康快照。</div></section><section class="panel"><div class="panel-head"><div><h2>盘片日志归档</h2><p>日志保存在服务器 results/logs 目录；采集过程可能耗时数十秒。</p></div></div><div class="log-actions"><button data-log="telemetry">全量 Telemetry</button><button data-log="telemetry_critical">关键 Telemetry</button><button data-log="extended_smart_c0">扩展 SMART 0xC0</button><button data-log="extended_smart_ca">扩展 SMART 0xCA</button></div><h3 class="subheading">已归档日志</h3><div id="health-logs" class="simple-list empty">暂无日志归档。</div></section></section></main><script src="/static/portal.js?v=20"></script></body></html>
