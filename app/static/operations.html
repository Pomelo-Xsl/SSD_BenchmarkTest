<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计划与兼容性 · SSD BenchmarkTest 系统</title><link rel="stylesheet" href="/static/portal.css?v=32"></head><body data-page="advanced"><header><a class="brand" href="/"><span class="brand-icon">S</span><span class="brand-text"><span class="brand-name">SSD BenchmarkTest</span><em>系统</em></span></a><nav><a data-nav="devices" href="/devices">设备扫描</a><a data-nav="tests" href="/tests">单项测试</a><a data-nav="qd" href="/qd-scan">QD 扫描</a><a data-nav="queue" href="/queue">批量测试</a><a data-nav="task-list" href="/tasks">全部任务</a><a data-nav="results" href="/results">结果查询</a><a data-nav="advanced" href="/advanced">高级功能</a></nav><b class="online">● <em id="service-status">服务检查中</em></b></header><main><section class="hero page"><div><p class="eyebrow">SCHEDULE &amp; COMPATIBILITY</p><h1>定时任务与兼容适配</h1><p>按周期自动创建 fio 批量测试，并集中查看当前服务器、操作系统和工具兼容能力。</p></div><a class="btn white" href="/advanced">返回高级功能</a></section><section class="health-layout"><section class="panel"><div class="panel-head"><div><h2>创建定时测试计划</h2><p>计划会按设置的周期运行；同一计划上一轮未完成时将自动跳过，避免并发压测。</p></div></div><div class="fields"><label><span class="field-title">计划名称</span><input id="plan-name" placeholder="例如：每日 4K 随机读取"></label><label><span class="field-title">目标设备</span><select id="plan-device"></select></label><label><span class="field-title">执行周期（分钟）</span><input id="plan-interval" type="number" min="1" max="43200" value="1440"></label><label><span class="field-title">测试类型</span><select id="plan-test"><option value="rand_read_4k">4K 随机读取（安全）</option><option value="seq_read_128k">128K 顺序读取（安全）</option></select></label></div><div class="actions"><button class="btn primary" id="plan-create">创建计划</button><span id="plan-message"></span></div><h3 class="subheading">已配置计划</h3><div id="plan-list" class="simple-list empty">暂无定时测试计划。</div></section><section class="panel"><div class="panel-head"><div><h2>系统兼容性</h2><p>自动识别当前系统能力，帮助确认可用的 NVMe、fio 和调度环境。</p></div></div><div id="compatibility-list" class="simple-list empty">正在检测平台能力…</div></section></section></main><script src="/static/portal.js?v=20"></script></body></html>
