<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QD 扫描 · SSD BenchmarkTest 系统</title><link rel="stylesheet" href="/static/portal.css?v=26"></head><body data-page="qd"><header><a class="brand" href="/"><span class="brand-icon">S</span><span class="brand-text"><span class="brand-name">SSD BenchmarkTest</span><em>系统</em></span></a><nav><a data-nav="devices" href="/devices">设备扫描</a><a data-nav="tests" href="/tests">单项测试</a><a data-nav="qd" href="/qd-scan">QD 扫描</a><a data-nav="queue" href="/queue">批量测试</a><a data-nav="task-list" href="/tasks">全部任务</a><a data-nav="results" href="/results">结果查询</a><a data-nav="advanced" href="/advanced">高级功能</a></nav><b class="online">● <em id="service-status">服务检查中</em></b></header><main><section class="hero page"><div><p class="eyebrow">QUEUE DEPTH SCAN</p><h1>QD 扫描</h1><p>用同一种负载依次测试多个队列深度，找出最佳性能点。</p></div><a class="btn white" href="/devices">选择设备</a></section><section class="target">目标设备 <strong id="qd-device">尚未选择</strong><a href="/devices">去扫描设备 →</a></section><section class="panel"><h2>扫描配置</h2><div class="fields"><label>测试类型<select id="qd-test"><option value="rand_read_4k">4K 随机读取（安全）</option><option value="seq_read_128k">128K 顺序读取（安全）</option><option value="rand_write_4k">4K 随机写入（危险）</option><option value="seq_write_128k">128K 顺序写入（危险）</option></select></label><label>QD 列表 <small>英文逗号分隔</small><input id="qd-values" value="1,2,4,8,16,32,64"></label><label>每个 QD 时长（秒）<input id="qd-runtime" type="number" min="1" value="60"></label><label>预热时长（秒）<input id="qd-ramp" type="number" min="0" value="10"></label><label>并发任务数<input id="qd-numjobs" type="number" min="1" value="1"></label><label>I/O 引擎<select id="qd-ioengine"><option value="io_uring">io_uring</option><option value="libaio">libaio</option><option value="sync">sync</option></select></label></div><label class="confirm hidden" id="qd-confirm"><input id="qd-destructive" type="checkbox"><span><b>我确认写入扫描会清除目标盘数据</b></span></label><div class="actions"><button class="btn primary" id="qd-start">开始 QD 扫描</button><span id="qd-message"></span></div></section></main><script src="/static/portal.js?v=14"></script></body></html>
