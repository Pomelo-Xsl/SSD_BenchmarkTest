<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单项测试 · SSD_BenchmarkTest</title><link rel="stylesheet" href="/static/portal.css?v=3"></head><body data-page="tests"><header><a class="brand" href="/"><i>S</i> SSD<span>_</span>BenchmarkTest</a><nav><a data-nav="devices" href="/devices">设备扫描</a><a data-nav="tests" href="/tests">单项测试</a><a data-nav="queue" href="/queue">批量测试</a><a data-nav="results" href="/results">结果查询</a></nav><b class="online">● <em id="service-status">服务检查中</em></b></header><main><section class="hero page"><div><p class="eyebrow">SINGLE FIO TEST</p><h1>单项测试</h1><p>选择一个 fio 负载方案并立即执行。</p></div><a class="btn white" href="/devices">更换测试设备</a></section><section class="target">目标设备 <strong id="selected-device">尚未选择</strong><a href="/devices">去扫描设备 →</a></section><section class="panel"><h2>1. 选择测试方案</h2><p class="muted">读取测试不会写入磁盘；写入测试需要手动确认。</p><div class="tests" id="test-grid"><label class="test selected"><input name="test" type="radio" value="rand_read_4k" checked><span>4K</span><b>随机读取</b><small>查看随机 IOPS 与延迟</small><em>只读 · 安全</em></label><label class="test"><input name="test" type="radio" value="seq_read_128k"><span>128K</span><b>顺序读取</b><small>查看连续读取带宽</small><em>只读 · 安全</em></label><label class="test danger"><input name="test" type="radio" value="rand_write_4k"><span>4K</span><b>随机写入</b><small>查看随机写入性能</small><em>写入 · 清除数据</em></label><label class="test danger"><input name="test" type="radio" value="seq_write_128k"><span>128K</span><b>顺序写入</b><small>查看连续写入带宽</small><em>写入 · 清除数据</em></label></div></section><section class="panel"><h2>2. 设置 fio 参数</h2><p class="muted">不修改时采用推荐配置；可按需填写自定义参数。</p><div class="fields"><label>测试时长 <small>秒</small><input id="runtime" type="number" min="1" value="60"></label><label>预热时长 <small>秒</small><input id="ramp" type="number" min="0" value="10"></label><label>队列深度 <small>iodepth</small><input id="iodepth" type="number" min="1" value="32"></label><label>并发任务 <small>numjobs</small><input id="numjobs" type="number" min="1" value="1"></label><label>块大小 <small>bs，可选</small><input id="block-size" placeholder="如 4k、128k"></label><label>I/O 引擎 <small>ioengine</small><input id="ioengine" value="io_uring"></label></div><label class="check"><input id="direct" type="checkbox" checked><span><b>绕过系统缓存</b><small>direct=1，推荐用于基准测试</small></span></label><details><summary>额外 fio 参数 <small>可选</small></summary><textarea id="extra-options" rows="5" placeholder="每行一个，例如：&#10;size=100G&#10;norandommap=true"></textarea></details><label class="confirm hidden" id="write-confirm"><input id="confirm-destructive" type="checkbox"><span><b>我已确认数据清除风险</b><small>写入测试会覆盖 <strong id="confirm-device"></strong> 上的数据。</small></span></label><div class="actions"><button class="btn primary" id="start-button">开始测试 →</button><button class="btn secondary" id="queue-button">加入批量队列</button><span id="form-message"></span></div></section></main><script src="/static/portal.js?v=4"></script></body></html>
